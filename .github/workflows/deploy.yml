name: Deploy to OSS

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 安装阿里云 CLI
        run: |
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz | tar -xz
          sudo mv aliyun /usr/local/bin/
      
      - name: 配置阿里云 CLI
        run: |
          aliyun configure set --access-key-id "${{ secrets.OSS_ACCESS_KEY_ID }}"
          aliyun configure set --access-key-secret "${{ secrets.OSS_ACCESS_KEY_SECRET }}"
          aliyun configure set --region cn-hangzhou
      
      - name: 上传文件到 OSS
        run: |
          aliyun oss cp ./ oss://fangtang1-oss/resources/sites/html/ --recursive --force
      
      - name: 设置 OSS Bucket 为公共读
        run: |
          aliyun oss bucket-acl --bucket fangtang1-oss --acl public-read
      
      - name: 测试线上网站
        run: |
          echo "等待权限生效..."
          sleep 5
          curl -f https://cdn.fang-tang.cn/resources/sites/html/aipai.html && echo "✅ 访问成功"