name: Deploy to OSS

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 安装阿里云 CLI
        run: |
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz | tar -xz
          sudo mv aliyun /usr/local/bin/
      
      - name: 配置阿里云 CLI
        run: |
          aliyun configure set \
            --access-key-id ${{ secrets.OSS_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            --region cn-hangzhou
      
      - name: 上传文件到 OSS
        run: |
          # 上传当前目录下所有文件到 OSS 的 resources/sites/html/ 路径
          aliyun oss cp ./ oss://fangtang1-oss/resources/sites/html/ --recursive --force
      
      - name: 测试线上网站
        run: |
          echo "等待部署完成..."
          sleep 5
          echo "测试 aipai.html..."
          curl -f https://cdn.fang-tang.cn/resources/sites/html/aipai.html && echo "✅ 访问成功"