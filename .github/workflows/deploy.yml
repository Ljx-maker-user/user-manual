name: Deploy to OSS

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 安装 ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64
          sudo mv ossutil64 /usr/local/bin/ossutil
      
      - name: 配置 ossutil
        run: |
          cat > ~/.ossutilconfig << EOF
          [Credentials]
          language=CH
          endpoint=oss-cn-hangzhou.aliyuncs.com
          accessKeyID=${{ secrets.OSS_ACCESS_KEY_ID }}
          accessKeySecret=${{ secrets.OSS_ACCESS_KEY_SECRET }}
          EOF
      
      - name: 上传文件到 OSS
        run: |
          ossutil cp ./ oss://fangtang1-oss/resources/sites/html/ --recursive --force
      
      - name: 设置 OSS Bucket 为公共读
        run: |
          ossutil bucket-acl oss://fangtang1-oss --acl public-read
      
      - name: 测试线上网站
        run: |
          echo "等待权限生效..."
          sleep 5
          echo "测试 aipai.html..."
          curl -f https://cdn.fang-tang.cn/resources/sites/html/aipai.html && echo "✅ 访问成功"